<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Tracker - 36 Lessons</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --primary: #4f46e5;
            --present-color: #10b981;
            --notebook-color: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.4rem;
            margin: 0;
            font-weight: 700;
        }

        .controls-row {
            display: flex;
            gap: 10px;
            align-items: center;
            width: 100%;
        }

        .lesson-select {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            border: 2px solid #cbd5e1;
            font-size: 1rem;
            font-weight: 600;
            background-color: white;
            color: var(--text-main);
            outline: none;
        }

        .lesson-select:focus {
            border-color: var(--primary);
        }

        .reset-btn {
            background-color: #fee2e2;
            border: none;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #ef4444;
            cursor: pointer;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .student-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .student-info {
            flex: 1;
        }

        .student-name {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .toggles {
            display: flex;
            gap: 12px;
        }

        .circle-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
            font-size: 0.85rem;
            font-weight: 500;
            color: #718096;
        }

        .circle-label input {
            opacity: 0;
            position: absolute;
            width: 0;
            height: 0;
        }

        .checkbox-circle {
            width: 24px;
            height: 24px;
            border: 2px solid #cbd5e1;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            position: relative;
            transition: all 0.2s ease;
        }

        .circle-label.present input:checked + .checkbox-circle {
            background-color: var(--present-color);
            border-color: var(--present-color);
        }

        .circle-label.notebook input:checked + .checkbox-circle {
            background-color: var(--notebook-color);
            border-color: var(--notebook-color);
        }

        .checkbox-circle::after {
            content: '';
            position: absolute;
            display: none;
            left: 8px;
            top: 4px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .circle-label input:checked + .checkbox-circle::after {
            display: block;
        }

        .score-section {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .score-circle {
            width: 40px;
            height: 40px;
            background-color: #edf2f7;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
        }

        .score-circle.has-points {
            background-color: #e0e7ff;
        }

        .score-actions {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .btn-circle {
            width: 28px;
            height: 28px;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            touch-action: manipulation;
        }

        .btn-plus {
            background-color: var(--primary);
            box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
        }

        .btn-minus {
            background-color: #cbd5e1;
            color: #64748b;
            font-size: 1.3rem;
        }

        .btn-circle:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <h1>Class Tracker</h1>
        </div>
        <div class="controls-row">
            <select id="lessonSelect" class="lesson-select" onchange="switchLesson(this.value)">
                <!-- Handled via script -->
            </select>
            <button class="reset-btn" onclick="resetCurrentLesson()">Clear Lesson</button>
        </div>
    </header>

    <div class="container" id="roster"></div>

    <script>
        const studentNames = [
            "Isaac Badman", "Sofia Castillo", "Allora Chaudhari", 
            "Kenjisan Limketkai", "Aanya Minnah", "Diya Rajendran", 
            "Ethan Shen", "Ryan Shih", "Scarlett Yi", "Ella Zubov"
        ];

        const TOTAL_LESSONS = 36;
        
        function createEmptyLessonData() {
            const data = {};
            studentNames.forEach(name => {
                data[name] = { present: false, notebook: false, score: 0 };
            });
            return data;
        }

        let appData = JSON.parse(localStorage.getItem('lessonsTrackerData')) || {};
        let currentLesson = localStorage.getItem('currentSelectedLesson') || "1";

        function initApp() {
            const selectEl = document.getElementById('lessonSelect');
            selectEl.innerHTML = ''; 
            for (let i = 1; i <= TOTAL_LESSONS; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.innerText = 'Lesson ' + i;
                if (String(i) === currentLesson) opt.selected = true;
                selectEl.appendChild(opt);
            }

            for (let i = 1; i <= TOTAL_LESSONS; i++) {
                if (!appData[i]) {
                    appData[i] = createEmptyLessonData();
                }
            }
            saveData();
            renderRoster();
        }

        function saveData() {
            localStorage.setItem('lessonsTrackerData', JSON.stringify(appData));
            localStorage.setItem('currentSelectedLesson', currentLesson);
        }

        function switchLesson(lessonNum) {
            currentLesson = lessonNum;
            saveData();
            renderRoster();
        }

        function updateAttendance(name, isChecked) {
            appData[currentLesson][name].present = isChecked;
            saveData();
        }

        function updateNotebook(name, isChecked) {
            appData[currentLesson][name].notebook = isChecked;
            saveData();
        }

        function changeScore(name, amount) {
            let currentScore = appData[currentLesson][name].score;
            if (currentScore + amount >= 0) {
                appData[currentLesson][name].score += amount;
                saveData();
                renderRoster();
            }
        }

        function resetCurrentLesson() {
            if (confirm('Reset all marks and scores ONLY for Lesson ' + currentLesson + '?')) {
                appData[currentLesson] = createEmptyLessonData();
                saveData();
                renderRoster();
            }
        }

        function renderRoster() {
            const rosterDiv = document.getElementById('roster');
            rosterDiv.innerHTML = ''; 

            const lessonRecords = appData[currentLesson];

            studentNames.forEach(name => {
                const data = lessonRecords[name];
                const scoreClass = data.score > 0 ? 'score-circle has-points' : 'score-circle';
                
                let cardHtml = '<div class="student-card">';
                cardHtml += '  <div class="student-info">';
                cardHtml += '    <div class="student-name">' + name + '</div>';
                cardHtml += '    <div class="toggles">';
                cardHtml += '      <label class="circle-label present">';
                cardHtml += '        <input type="checkbox" ' + (data.present ? 'checked' : '') + ' onchange="updateAttendance(\'' + name + '\', this.checked)">';
                cardHtml += '        <span class="checkbox-circle"></span> Present';
                cardHtml += '      </label>';
                cardHtml += '      <label class="circle-label notebook">';
                cardHtml += '        <input type="checkbox" ' + (data.notebook ? 'checked' : '') + ' 
                onchange="updateNotebook('' + name + '', this.checked)">';
                cardHtml += '         Notebook';
                cardHtml += '      ';
                cardHtml += '    ';
                cardHtml += '  ';
                cardHtml += '  ';
                cardHtml += '    ' + data.score + '';
                cardHtml += '    ';
                cardHtml += '      +';
                cardHtml += '      -';
                cardHtml += '    ';
                cardHtml += '  ';
                cardHtml += '';

                
                rosterDiv.innerHTML += cardHtml;
            });
        }
        
        initApp();
    </script>
</body>
</html>
