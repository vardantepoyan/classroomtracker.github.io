<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Tracker - 36 Lessons</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --primary: #4f46e5;
            --present-color: #10b981;
            --notebook-color: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.4rem;
            margin: 0;
            font-weight: 700;
        }

        .controls-row {
            display: flex;
            gap: 10px;
            align-items: center;
            width: 100%;
        }

        .lesson-select {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            border: 2px solid #cbd5e1;
            font-size: 1rem;
            font-weight: 600;
            background-color: white;
            color: var(--text-main);
            outline: none;
        }

        .lesson-select:focus {
            border-color: var(--primary);
        }

        .reset-btn {
            background-color: #fee2e2;
            border: none;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #ef4444;
            cursor: pointer;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .student-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .student-info {
            flex: 1;
        }

        .student-name {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .toggles {
            display: flex;
            gap: 12px;
        }

        .circle-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
            font-size: 0.85rem;
            font-weight: 500;
            color: #718096;
        }

        .circle-label input {
            opacity: 0;
            position: absolute;
            width: 0;
            height: 0;
        }

        .checkbox-circle {
            width: 24px;
            height: 24px;
            border: 2px solid #cbd5e1;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            position: relative;
            transition: all 0.2s ease;
        }

        .circle-label.present input:checked + .checkbox-circle {
            background-color: var(--present-color);
            border-color: var(--present-color);
        }

        .circle-label.notebook input:checked + .checkbox-circle {
            background-color: var(--notebook-color);
            border-color: var(--notebook-color);
        }

        .checkbox-circle::after {
            content: '';
            position: absolute;
            display: none;
            left: 8px;
            top: 4px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .circle-label input:checked + .checkbox-circle::after {
            display: block;
        }

        .score-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .score-circle {
            width: 40px;
            height: 40px;
            background-color: #edf2f7;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
        }

        .score-circle.has-points {
            background-color: #e0e7ff;
        }

        .score-actions {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .btn-circle {
            width: 28px;
            height: 28px;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            touch-action: manipulation;
            padding: 0;
        }

        .btn-plus {
            background-color: var(--primary);
            box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
        }

        .btn-minus {
            background-color: #cbd5e1;
            color: #64748b;
            font-size: 1.3rem;
        }

        .btn-circle:active {
            transform: scale(0.9);
        }

        .loading-msg {
            text-align: center;
            color: #94a3b8;
            padding: 32px 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <h1>Class Tracker</h1>
        </div>
        <div class="controls-row">
            <select id="lessonSelect" class="lesson-select" onchange="switchLesson(this.value)">
                <!-- Handled via script -->
            </select>
            <button class="reset-btn" onclick="resetCurrentLesson()">Clear Lesson</button>
        </div>
    </header>

    <div class="container" id="roster">
        <div class="loading-msg">Loading…</div>
    </div>

    <script>
        const studentNames = [
            "Isaac Badman", "Sofia Castillo", "Allora Chaudhari",
            "Kenjisan Limketkai", "Aanya Minnah", "Diya Rajendran",
            "Ethan Shen", "Ryan Shih", "Scarlett Yi", "Ella Zubov"
        ];

        const TOTAL_LESSONS = 36;
        const STORAGE_KEY = 'classTrackerState';

        function createEmptyLessonData() {
            const data = {};
            studentNames.forEach(name => {
                data[name] = { present: false, notebook: false, score: 0 };
            });
            return data;
        }

        let appData = { lessons: {} };
        let currentLesson = "1";

        async function loadData() {
            try {
                const result = await window.storage.get(STORAGE_KEY, false);
                if (result && result.value) {
                    const parsed = JSON.parse(result.value);
                    appData.lessons = parsed.lessons || {};
                    currentLesson = parsed.currentLesson || "1";
                }
            } catch (err) {
                // No saved state yet (or a read error) - start fresh
                appData.lessons = {};
                currentLesson = "1";
            }
        }

        async function saveData() {
            try {
                const result = await window.storage.set(STORAGE_KEY, JSON.stringify({
                    lessons: appData.lessons,
                    currentLesson: currentLesson
                }), false);
                if (!result) {
                    console.error('Storage set returned no result');
                }
            } catch (err) {
                console.error('Failed to save class tracker data:', err);
            }
        }

        function ensureAllLessonsExist() {
            for (let i = 1; i <= TOTAL_LESSONS; i++) {
                if (!appData.lessons[i]) {
                    appData.lessons[i] = createEmptyLessonData();
                }
            }
        }

        function populateLessonSelect() {
            const selectEl = document.getElementById('lessonSelect');
            selectEl.innerHTML = '';
            for (let i = 1; i <= TOTAL_LESSONS; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.innerText = 'Lesson ' + i;
                if (String(i) === String(currentLesson)) opt.selected = true;
                selectEl.appendChild(opt);
            }
        }

        async function switchLesson(lessonNum) {
            currentLesson = lessonNum;
            await saveData();
            renderRoster();
        }

        async function updateAttendance(name, isChecked) {
            appData.lessons[currentLesson][name].present = isChecked;
            await saveData();
        }

        async function updateNotebook(name, isChecked) {
            appData.lessons[currentLesson][name].notebook = isChecked;
            await saveData();
        }

        async function changeScore(name, amount) {
            const record = appData.lessons[currentLesson][name];
            if (record.score + amount >= 0) {
                record.score += amount;
                await saveData();
                renderRoster();
            }
        }

        async function resetCurrentLesson() {
            if (confirm('Reset all marks and scores ONLY for Lesson ' + currentLesson + '?')) {
                appData.lessons[currentLesson] = createEmptyLessonData();
                await saveData();
                renderRoster();
            }
        }

        function renderRoster() {
            const rosterDiv = document.getElementById('roster');
            const lessonRecords = appData.lessons[currentLesson];

            rosterDiv.innerHTML = studentNames.map(name => {
                const data = lessonRecords[name];
                const scoreClass = data.score > 0 ? 'score-circle has-points' : 'score-circle';

                return `
                    <div class="student-card">
                        <div class="student-info">
                            <div class="student-name">${name}</div>
                            <div class="toggles">
                                <label class="circle-label present">
                                    <input type="checkbox" data-action="attendance" data-name="${name}" ${data.present ? 'checked' : ''}>
                                    <span class="checkbox-circle"></span> Present
                                </label>
                                <label class="circle-label notebook">
                                    <input type="checkbox" data-action="notebook" data-name="${name}" ${data.notebook ? 'checked' : ''}>
                                    <span class="checkbox-circle"></span> Notebook
                                </label>
                            </div>
                        </div>
                        <div class="score-section">
                            <div class="${scoreClass}">${data.score}</div>
                            <div class="score-actions">
                                <button type="button" class="btn-circle btn-plus" data-action="score-plus" data-name="${name}">+</button>
                                <button type="button" class="btn-circle btn-minus" data-action="score-minus" data-name="${name}">&minus;</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function attachRosterListeners() {
            const rosterDiv = document.getElementById('roster');

            rosterDiv.addEventListener('change', (e) => {
                const target = e.target;
                const name = target.dataset.name;
                if (target.dataset.action === 'attendance') {
                    updateAttendance(name, target.checked);
                } else if (target.dataset.action === 'notebook') {
                    updateNotebook(name, target.checked);
                }
            });

            rosterDiv.addEventListener('click', (e) => {
                const btn = e.target.closest('button[data-action]');
                if (!btn) return;
                const name = btn.dataset.name;
                if (btn.dataset.action === 'score-plus') {
                    changeScore(name, 1);
                } else if (btn.dataset.action === 'score-minus') {
                    changeScore(name, -1);
                }
            });
        }

        async function initApp() {
            await loadData();
            ensureAllLessonsExist();
            populateLessonSelect();
            attachRosterListeners();
            renderRoster();
            await saveData();
        }

        initApp();
    </script>
</body>
</html>
